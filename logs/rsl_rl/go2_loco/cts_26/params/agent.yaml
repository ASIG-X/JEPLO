seed: 42
device: cuda:0
num_steps_per_env: 24
max_iterations: 100000
empirical_normalization: false
obs_groups: {}
clip_actions: null
save_interval: 500
experiment_name: go2_loco
run_name: cts_26
logger: tensorboard
neptune_project: isaaclab
wandb_project: isaaclab
resume: false
load_run: .*
load_checkpoint: model_.*.pt
class_name: OnPolicyRunner
policy:
  init_noise_std: 1.0
  noise_std_type: scalar
  state_dependent_std: false
  actor_obs_normalization: false
  critic_obs_normalization: false
  actor_hidden_dims:
  - 512
  - 256
  - 128
  critic_hidden_dims:
  - 512
  - 256
  - 128
  activation: elu
algorithm:
  num_learning_epochs: 10
  num_mini_batches: 4
  learning_rate: 0.001
  schedule: adaptive
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.01
  desired_kl: 0.01
  max_grad_norm: 1.0
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  rnd_cfg: null
  symmetry_cfg: null
  student_env_ratio: 0.25
  warmup_iters:
  - 5000
  - 10000
  student_encoder_learning_rate: 0.0002
  student_encoder_loss_coef: 1.0
eval_interval: 1000
onnx_test_samples: 10
launch_command: python scripts/train.py --run_name cts_26 --wandb_proj cts --num_envs
  4096 --max_iterations 100000 --cts --student_env_ratio 0.25 --warmup_iters 5000
  10000
launch_cwd: /home/kailaili2/go2_parkour
wandb_run_name: cts_26_2026-08-19_22-27-33
